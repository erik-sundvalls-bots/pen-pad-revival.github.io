part2:
  number: 2
  title: The User Centered Design Process, Human Factors, Problem & Solution Space
  intro: Alan Rector, a central researcher in the PEN&PAD approach to electronic health records, in a conversation with Erik
    Sundvall and Daniel Karlsson.
  being_edited: false
  coming_soon: false
  chapters_provisional: false
  slides_first: false
  transcript: true
  poster: /assets/interviews/part-2/title.png
  captions:
    vtt: /assets/interviews/part-2/pen-pad-interview-alan-rector-part2.en.vtt
    srt: /assets/interviews/part-2/pen-pad-interview-alan-rector-part2.en.srt
    txt: /assets/interviews/part-2/pen-pad-interview-alan-rector-part2_transcript.txt
    chapters_vtt: /assets/interviews/part-2/pen-pad-interview-alan-rector-part2_chapters.vtt
  chapters:
  - label: "0:00"
    seek: 0
    text: 'How the user centered design ideas came about: workshops with GPs, programmers and psychologists'
    transcript_id: t-00-01
  - label: '1:53'
    seek: 113
    text: Photos from the workshops ('three ring circuses') - circular menus and radio buttons were a disaster; actors playing
      patients
    transcript_id: t-01-11
  - label: '4:12'
    seek: 252
    text: Rapid prototyping in Smalltalk - 'cardboard' interfaces built before the guts behind them; useful and usable
    transcript_id: t-04-12
  - label: '5:33'
    seek: 333
    text: 'Summarizing the medical record: problem lists, graphs and timelines - ''exhaustive is the enemy of the useful'''
    transcript_id: t-04-34
  - label: '6:59'
    seek: 419
    text: Typing and Read codes by heart - fast paths for experienced users
    transcript_id: t-06-58
  - label: '8:21'
    seek: 501
    text: Tailoring to each doctor and practice - favourite prescriptions, and AI for personalization today?
    transcript_id: t-08-23
  - label: '10:16'
    seek: 616
    text: Different forms for different trials, CLEF - 'it's very easy to do things that aren't helpful'
    transcript_id: t-10-02
  - label: '12:00'
    seek: 720
    text: '''Death by a thousand clicks'' - throwing out a prototype isn''t painful. Low code/no code prototyping today? ''Essential.'''
    transcript_id: t-11-52
  - label: '13:22'
    seek: 802
    text: 'What works in general practice doesn''t work everywhere: geriatrics, radiologists and light boxes'
    transcript_id: t-13-02
  - label: '15:37'
    seek: 937
    text: One record system for the whole hospital and general practice? Modules and tailoring (cath lab, dermatology photos)
    transcript_id: t-15-38
  - label: '17:29'
    seek: 1049
    text: Individual options per doctor, and typing or voice into a big tree - record exactly what was said, or offer alternatives?
    transcript_id: t-17-04
  - label: '21:56'
    seek: 1316
    text: '''Medicine is a humanly impossible task'' and a wicked problem - errors, interruptions and reminders'
    transcript_id: t-21-56
  - label: '25:16'
    seek: 1516
    text: You don't need a computer to fix everything (incompatible gas connectors, coloured syringes) - but slow deterioration
      is hard to catch
    transcript_id: t-25-16
  - label: '27:50'
    seek: 1670
    text: The end
    transcript_id: t-27-52
