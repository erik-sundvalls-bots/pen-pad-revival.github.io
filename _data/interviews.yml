    video_url: https://www.youtube.com/watch?v=PGEAmJJ4frU&t=1524s
    transcript_id: t-25-22
  - label: '28:58'
    seek: 1738
    text: '''The user is always right, but they are usually wrong'''
    video_url: https://www.youtube.com/watch?v=PGEAmJJ4frU&t=1738s
    transcript_id: t-28-07
  - label: '29:49'
    seek: 1789
