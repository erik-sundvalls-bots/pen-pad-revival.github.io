  chapters:
  - label: "0:00"
    seek: 0
    text: Who is Alan Rector and how did he get involved in this? An innovative research environment.
    transcript_id: t-00-00
  - label: '1:23'
    seek: 83
    text: '''Expert systems'' for clinicians - ''bonkers idea'' - but the user centered research gave birth to the PEN&PAD
      approach.'
    transcript_id: t-00-17
  - label: '4:21'
    seek: 261
    text: (Anecdote - the Arnold Schwarzenegger laptop)
    transcript_id: t-04-21
  - label: '5:12'
    seek: 312
    text: User centered design + the "swiss army knife" of knowledge representation (description logics, GALEN etc.)
    transcript_id: t-04-25
  - label: '6:33'
    seek: 393
    text: The ICD-11 project and it's relation to SNOMED CT
    transcript_id: t-06-22
  - label: '11:25'
    seek: 685
    text: Live demo of the PEN & PAD-based Clinergy user interface, explained by Alan
    transcript_id: t-11-13
  - label: '22:19'
    seek: 1339
    text: Was it used? What eventually killed PEN&PAD and GALEN commercially?
    transcript_id: t-22-16
  - label: '25:24'
    seek: 1524
    text: What about user Acceptance? Could 'death by a thousand clicks' be avoided? Different user preferences, keyboard
      shortcuts etc.
    transcript_id: t-25-22
  - label: '28:58'
    seek: 1738
    text: '''The user is always right, but they are usually wrong'''
    transcript_id: t-28-07
  - label: '29:49'
    seek: 1789
    text: Ahead of it's time & technological challenges. + Info about interview parts 2 & 3
    transcript_id: t-29-18
  - label: '31:58'
    seek: 1918
    text: About generating 'Read codes' (Bonus track)
    transcript_id: t-31-54
  - label: '32:53'
    seek: 1973
    text: The end
    transcript_id: t-32-21
