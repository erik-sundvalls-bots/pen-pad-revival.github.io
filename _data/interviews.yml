part3:
  number: 3
  title: Technical details, terminology systems, ontologies and logic
  intro: Alan Rector, a central researcher in the PEN&PAD approach to electronic health records, in a conversation with Erik
    Sundvall and Daniel Karlsson.
  being_edited: true
  coming_soon: true
  chapters_provisional: true
  slides_first: true
  transcript: false
  chapters:
  - label: "0:00"
    seek: 0
    text: 'The technology and semantics underneath: tailoring forms beyond hand programming meets knowledge representation'
  - label: '2:04'
    seek: 124
    text: SMK, later GRAIL - a language for 'conceptual Lego'; frame systems and tangled semantic networks
  - label: '4:53'
    seek: 293
    text: Inheriting the most specific things and collecting them onto a form (the hypertension example)
  - label: '7:07'
    seek: 427
    text: 'Extrinsics in GALEN, and normalizing the ontology: primitive trees stuck together with properties'
  - label: '9:20'
    seek: 560
    text: 'Pulling apart part-whole, function and structure - primitive hierarchies without exceptions (supernumerary fingers,
      dextrocardia: ''it''s biology, not physics'')'
  - label: '13:17'
    seek: 797
    text: Classifiers and most specific generalizations (more in the 'On beyond Gruber' paper)
  - label: '16:11'
    seek: 971
    text: Collecting forms, treatments and codes (ICD, Read codes); negation in description logics and the need for queries
  - label: '18:42'
    seek: 1122
    text: Querying an OWL ontology - the 'hypertension not in pregnancy' trap
  - label: '21:32'
    seek: 1292
    text: Why check after classification? Errors propagate - getting the foot out of the pelvis in SNOMED
  - label: '24:58'
    seek: 1498
    text: 12 hours per classifier run - regression queries 'just like software testing'; user interfaces and language generation
      as QA
  - label: '28:49'
    seek: 1729
    text: Pre- or post-coordination? Clean, normalized hierarchies; axioms vs generalizations (penicillins, Tweety the bird)
  - label: '34:02'
    seek: 2042
    text: Modular ontologies and property patterns - contributions to OWL
  - label: '35:51'
    seek: 2151
    text: 'Final words for techies: the same technique in ICD-11, queries to coordinate SNOMED and ICD, ''rigid'' properties'
  - label: '40:10'
    seek: 2410
    text: The end
  overlays:
  - src: /assets/interviews/part-3/title.png
    width: 1600
    height: 900
    alt: Title card for part 3 of the Alan Rector PEN&PAD interview
    caption: Title card for this part.
part4:
  number: 4
  title: Lessons learned – how we’d do it today + some advice to those entering the health informatics space
  intro: Alan Rector, a central researcher in the PEN&PAD approach to electronic health records, in a conversation with Erik
    Sundvall and Daniel Karlsson.
  being_edited: true
  coming_soon: true
  chapters_provisional: true
  slides_first: true
  transcript: false
  chapters:
  - label: "0:00"
    seek: 0
    text: How would you do this today? Where do SNOMED CT, openEHR archetypes, HL7 FHIR and queries fit in? (The 'propeller'
      paper)
  - label: "0:48"
    seek: 48
    text: 'Terminology is just one part of the system: concept model, information/EHR model and inference model - coordinated,
      but not the same thing'
  - label: '4:19'
    seek: 259
    text: 'If doing it today: archetypes hung on a concept model? Grading and staging of cancers in a cancer trial project'
  - label: '7:34'
    seek: 454
    text: openEHR, FHIR and finding the right granularity - 'I'd certainly use SNOMED if I were starting today'
  - label: '8:37'
    seek: 517
    text: 'Query SNOMED rather than create new concepts. Lessons from the ICD-11 project: statistics need stability, and ICD
      wouldn''t work for PEN&PAD'
  - label: '14:20'
    seek: 860
    text: 'Building on SNOMED: watch out for primitives with more than one parent, and terminologies built by committee'
  - label: '18:02'
    seek: 1082
    text: 'Redoing PEN&PAD today: rethink user centered design for touch screens, pens, voice and natural language - ''Is
      this what you meant?'''
  - label: '22:51'
    seek: 1371
    text: Don't make one thing serve too many purposes (HL7 V3 prescriptions) - a flexible combination of modules
  - label: '26:27'
    seek: 1587
    text: Centering the record on the patient, and language generation for clinicians and for patients
  - label: '29:44'
    seek: 1784
    text: Sharing records between institutions and departments - find the nugget that needs to be transmitted; how do you
      summarize?
  - label: '35:19'
    seek: 2119
    text: Systems built out of bits and pieces - lessons from SGML and HTML ('Page not found')
  - label: '39:58'
    seek: 2398
    text: Advice to students coming into health informatics from the computer or the medical side - talk to psychologists,
      nurses and junior doctors
  - label: '48:04'
    seek: 2884
    text: 'Alan''s acknowledgements: the PEN&PAD, GALEN and OWL teams'
  - label: '49:50'
    seek: 2990
    text: The end
  overlays:
  - src: /assets/interviews/part-4/title.png
    width: 1600
    height: 900
    alt: Title card for part 4 of the Alan Rector PEN&PAD interview
    caption: Title card for this part.
