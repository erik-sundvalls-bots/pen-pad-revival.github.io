part1:
  number: 1
  title: Intro & Demo of PEN&PAD
  intro: Alan Rector, a central researcher in the PEN&PAD approach to electronic health records, in a conversation with Erik
    Sundvall and Daniel Karlsson.
  bullets:
  - Who is Alan Rector and how did he get involved in this?
  - What was PEN&PAD? (Including live demo of the PEN & PAD-based Clinergy user interface)
  - Where did it lead?
  being_edited: false
  coming_soon: false
  chapters_provisional: false
  slides_first: false
  transcript: true
  captions:
    vtt: /assets/interviews/part-1/pen-pad-interview-alan-rector-part1.en.vtt
    srt: /assets/interviews/part-1/pen-pad-interview-alan-rector-part1.en.srt
    chapters_vtt: /assets/interviews/part-1/pen-pad-interview-alan-rector-part1_chapters.vtt
    txt: /assets/interviews/part-1/pen-pad-interview-alan-rector-part1_transcript.txt
  chapters:
  - label: "0:00"
    seek: 0
    text: Who is Alan Rector and how did he get involved in this? An innovative research environment.
    video_url: https://www.youtube.com/watch?v=PGEAmJJ4frU
    transcript_id: t-00-00
  - label: '1:23'
    seek: 83
    text: '''Expert systems'' for clinicians - ''bonkers idea'' - but the user centered research gave birth to the PEN&PAD
      approach.'
    video_url: https://www.youtube.com/watch?v=PGEAmJJ4frU&t=83s
    transcript_id: t-00-17
  - label: '4:21'
    seek: 261
    text: (Anecdote - the Arnold Schwarzenegger laptop)
    video_url: https://www.youtube.com/watch?v=PGEAmJJ4frU&t=261s
    transcript_id: t-04-21
  - label: '5:12'
    seek: 312
    text: User centered design + the "swiss army knife" of knowledge representation (description logics, GALEN etc.)
    video_url: https://www.youtube.com/watch?v=PGEAmJJ4frU&t=312s
    transcript_id: t-04-25
  - label: '6:33'
    seek: 393
    text: The ICD-11 project and it's relation to SNOMED CT
    video_url: https://www.youtube.com/watch?v=PGEAmJJ4frU&t=393s
    transcript_id: t-06-22
  - label: '11:25'
    seek: 685
    text: Live demo of the PEN & PAD-based Clinergy user interface, explained by Alan
    video_url: https://www.youtube.com/watch?v=PGEAmJJ4frU&t=685s
    transcript_id: t-11-13
  - label: '22:19'
    seek: 1339
    text: Was it used? What eventually killed PEN&PAD and GALEN commercially?
